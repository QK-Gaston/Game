<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红山小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            /* 整体垂直+水平居中 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            background-color: #f7f7f7;
        }
        h2 {
            font-size: 28px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .game-btn {
            /* 在这里调整按钮大小 */
            width: 160px;
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            /* 彩虹渐变 */
            background: linear-gradient(90deg, rgb(241, 156, 203));
            cursor: pointer;
            transition: transform 0.2s;
        }
        .game-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h2>🎮 红山小游戏 🎮</h2>
    <div class="btn-group">
        <button class="game-btn" onclick="location.href='Sudoku.html'">小数独</button>
        <button class="game-btn" onclick="location.href='Shuzizhadan.html'">小炸弹</button>
        <button class="game-btn" onclick="location.href='ShuziHuarongdao.html'">华容道</button>
        <button class="game-btn" onclick="location.href='Firefly.html'">萤火虫</button>
        <button class="game-btn" onclick="location.href='Scoreboard.html'">记分牌</button>
    </div>
</body>
</html>
