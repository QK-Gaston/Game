<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数字华容道</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --pink:#f8cfea;
    --pink-strong:#f087c1;
    --line:#c9c9c9;
    --line-bold:#555;
    --ink:#000;
    --ink-faint:rgba(0,0,0,.5);
    --bg:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px);
    max-width:560px;margin:0 auto;
  }
  /* 顶层三等分网格，上下对齐！ */
  .top-wrap{
    width:100%;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    align-items:center;
    margin-bottom:10px;
  }
  .top-left{
    text-align:left;
  }
  .top-center{
    text-align:center;
  }
  .top-right{
    text-align:right;
  }
  header{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  h1{font-size:20px;font-weight:700;}
  .love-tip{font-size:20px;color:#eb7fb8;white-space:nowrap；}
  .status{font-size:15px;color:#666;}
 



  .tabs{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:8px;
    width:100%;
    margin-bottom:12px;
  }
  .tabs button{
    padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:10px;
    font-size:15px;color:#333;cursor:pointer;
  }
  .tabs button.active{background:var(--pink-strong);border-color:var(--pink-strong);color:#000;font-weight:600;}
  .board-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  .puzzle-board{
    display:grid;
    gap:3px;
  }
  .puzzle-cell{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    background:#fff;
    border:1px solid var(--line);
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    overflow:hidden;
  }
  .puzzle-cell.empty{
    background:#eeeeee;
    border:1px dashed #bbb;
    cursor:default;
  }
  .puzzle-cell.can-move{
    background:var(--pink);
  }
  .puzzle-cell.correct{
    background:#e6f9e9;
  }
  .tile-num{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform 220ms ease-out;
  }
  .keypad{
    width:100%;
    display:grid;
    gap:8px;
  }
  /* 第一行：撤回、重开，两列等分 */
  .util-row1{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:8px;
  }
  /* 第二行：宽哥按钮，占整行 */
  .util-row2{
    display:grid;
    grid-template-columns: 1fr;
    gap:8px;
  }
  .keypad button{
    border:1px solid var(--line);background:#fff;border-radius:12px;
    font-size:13px;font-weight:500;padding:10px 0;cursor:pointer;
  }
  .keypad button:active{background:var(--pink);}
  .keypad button:disabled{background:#eee;color:#999;cursor:not-allowed;}
  .win{
    margin-top:8px;width:100%;text-align:center;font-size:16px;font-weight:600;color:#1a7f37;
    display:none;
  }
</style>
</head>
<body>
<div class="top-wrap">
  <div class="top-left">
    <h1>华容道</h1>
  </div>
  <div class="top-center">
    <div class="love-tip">💗希望世界和平💗</div>
  </div>
  <div class="top-right">
    <div class="status" id="status">小学生</div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button data-level="easy" class="active">斧子哥</button>
  <button data-level="medium">橘子哥</button>
  <button data-level="hard">宽子哥</button>
</div>

<div class="board-wrap">
  <div class="puzzle-board" id="board"></div>
</div>
<div class="keypad" id="keypad">
  <div class="util-row1">
    <button id="undoBtn">撤回</button>
    <button id="newBtn">重开</button>
  </div>
  <div class="util-row2">
    <button id="solveAllBtn">💗快让开，宽哥要显神啦💗</button>
  </div>
</div>
<div class="win" id="win">🐦世界和平啦~~</div>
<script>
"use strict";
const LEVELS = {
  easy:   { label:"小学生", size:3, cell:80, font:28 },
  medium: { label:"初中生", size:4, cell:62, font:22 },
  hard:   { label:"高中生", size:5, cell:50, font:18 },
};
let state = {
  level: "easy",
  cfg: LEVELS.easy,
  arr: [],
  emptyIdx: 0,
  history: [],
  isAutoSolving: false,
  animating: false,
};
const statusEl = document.getElementById("status");
const winEl = document.getElementById("win");
const boardEl = document.getElementById("board");
const undoBtn = document.getElementById("undoBtn");
const newBtn = document.getElementById("newBtn");
const solveAllBtn = document.getElementById("solveAllBtn");
undoBtn.disabled = false;
newBtn.disabled = false;
solveAllBtn.disabled = false;
function getTarget(size){
  const total = size * size;
  const target = [];
  for(let i=1;i<total;i++) target.push(i);
  target.push(0);
  return target;
}
function isSolvable(arr, size){
  const flat = [...arr];
  const emptyPos = flat.indexOf(0);
  const emptyRowFromBottom = size - Math.floor(emptyPos / size);
  flat.splice(emptyPos,1);
  let inv = 0;
  for(let i=0;i<flat.length;i++){
    for(let j=i+1;j<flat.length;j++){
      if(flat[i] > flat[j]) inv++;
    }
  }
  if(size %2 ===1){
    return inv %2 ===0;
  }else{
    return ((inv + emptyRowFromBottom) %2) ===1;
  }
}
function generatePuzzle(size){
  let arr = getTarget(size);
  let shuffleTimes = size*size*80;
  let empty = arr.indexOf(0);
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  const w = size;
  for(let s=0;s<shuffleTimes;s++){
    const r = Math.floor(empty / w);
    const c = empty % w;
    const candidates = [];
    for(let d=0;d<4;d++){
      const nr = r + dirs[d][0];
      const nc = c + dirs[d][1];
      if(nr >=0 && nr < w && nc >=0 && nc < w){
        candidates.push(d);
      }
    }
    const pick = candidates[Math.floor(Math.random()*candidates.length)];
    const er = r + dirs[pick][0];
    const ec = c + dirs[pick][1];
    const nidx = er * w + ec;
    [arr[empty], arr[nidx]] = [arr[nidx], arr[empty]];
    empty = nidx;
  }
  if(!isSolvable(arr, size)){
    if(arr[0]!==0 && arr[1]!==0){
      [arr[0], arr[1]] = [arr[1], arr[0]];
    }else{
      [arr[2], arr[3]] = [arr[3], arr[2]];
    }
  }
  return {arr, emptyIdx: arr.indexOf(0)};
}
function render(){
  const cfg = state.cfg;
  const size = cfg.size;
  const total = size * size;
  boardEl.style.gridTemplateColumns = `repeat(${size}, ${cfg.cell}px)`;
  boardEl.innerHTML = "";
  const target = getTarget(size);
  const er = Math.floor(state.emptyIdx / size);
  const ec = state.emptyIdx % size;
  for(let i=0;i<total;i++){
    const val = state.arr[i];
    const cell = document.createElement("div");
    cell.className = "puzzle-cell";
    cell.style.width = cfg.cell + "px";
    cell.style.height = cfg.cell + "px";
    cell.dataset.idx = i;
    if(val === 0){
      cell.classList.add("empty");
    }else{
      const tile = document.createElement("div");
      tile.className = "tile-num";
      tile.style.fontSize = cfg.font + "px";
      tile.textContent = val;
      cell.appendChild(tile);
      const r = Math.floor(i / size);
      const c = i % size;
      const isAdj = (Math.abs(r-er)===1 && c===ec) || (Math.abs(c-ec)===1 && r===er);
      if(isAdj) cell.classList.add("can-move");
      if(val === target[i]) cell.classList.add("correct");
    }
    boardEl.appendChild(cell);
  }
  checkWin();
}
function checkWin(){
  const target = getTarget(state.cfg.size);
  let ok = true;
  for(let i=0;i<target.length;i++){
    if(state.arr[i] !== target[i]) { ok=false; break; }
  }
  winEl.style.display = ok ? "block" : "none";
  return ok;
}
async function animateMove(moveIdx, isAuto=false){
  if(state.animating) return false;
  const size = state.cfg.size;
  const cellSize = state.cfg.cell;
  const r1 = Math.floor(moveIdx / size);
  const c1 = moveIdx % size;
  const er = Math.floor(state.emptyIdx / size);
  const ec = state.emptyIdx % size;
  const isAdj = (Math.abs(r1-er)===1 && c1===ec) || (Math.abs(c1-ec)===1 && r1===er);
  if(!isAdj) return false;
  state.animating = true;
  const moveCell = boardEl.querySelector(`[data-idx="${moveIdx}"]`);
  if(!moveCell){
    state.animating = false;
    return false;
  }
  const tileDom = moveCell.querySelector(".tile-num");
  if(!tileDom){
    state.animating = false;
    return false;
  }
  let tx=0, ty=0;
  if(r1 < er) ty = cellSize;
  else if(r1 > er) ty = -cellSize;
  else if(c1 < ec) tx = cellSize;
  else if(c1 > ec) tx = -cellSize;
  tileDom.style.transform = `translate(${tx}px, ${ty}px)`;
  await new Promise(res=>setTimeout(res,220));
  if(!isAuto){
    state.history.push({arr:[...state.arr], emptyIdx:state.emptyIdx});
  }
  [state.arr[moveIdx], state.arr[state.emptyIdx]] = [state.arr[state.emptyIdx], state.arr[moveIdx]];
  state.emptyIdx = moveIdx;
  render();
  state.animating = false;
  return true;
}
function undo(){
  if(state.history.length ===0 || state.isAutoSolving || state.animating) return;
  const last = state.history.pop();
  state.arr = last.arr;
  state.emptyIdx = last.emptyIdx;
  render();
}
function newGame(level){
  state.level = level;
  state.cfg = LEVELS[level];
  const res = generatePuzzle(state.cfg.size);
  state.arr = res.arr;
  state.emptyIdx = res.emptyIdx;
  state.history = [];
  state.isAutoSolving = false;
  state.animating = false;
  undoBtn.disabled = false;
  newBtn.disabled = false;
  solveAllBtn.disabled = false;
  statusEl.textContent = state.cfg.label;
  winEl.style.display = "none";
  render();
}
// 💗快让开，宽哥要显神啦💗：全部难度直接瞬间完成
function autoSolveAll(){
  if(state.isAutoSolving || state.animating) return;
  if(checkWin()) return;
  const targetArr = getTarget(state.cfg.size);
  state.arr = [...targetArr];
  state.emptyIdx = state.arr.indexOf(0);
  render();
  checkWin();
}
boardEl.addEventListener("click", async e=>{
  if(state.isAutoSolving || state.animating) return;
  const cell = e.target.closest(".puzzle-cell");
  if(!cell) return;
  const idx = +cell.dataset.idx;
  await animateMove(idx, false);
})
undoBtn.onclick = undo;
newBtn.onclick = ()=> newGame(state.level);
solveAllBtn.onclick = autoSolveAll;
document.getElementById("tabs").addEventListener("click",e=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  newGame(btn.dataset.level);
})
newGame("easy");
</script>
</body>
</html>
